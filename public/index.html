<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>TODO TABLETS // EXECUTION OS</title>

  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Todo OS" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#08102a" />
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="fx" aria-hidden="true">
    <div class="dither"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <div class="title-row">
            <h1 class="title">TODO TABLETS</h1>
          </div>
          <div class="subtitle">SOLAR SWORD // JESUS LANDSCAPE // <span id="sync-status">CONNECTING</span></div>
        </div>
      </div>

      <div class="top-actions signed-in-only hidden">
        <button class="btn btn-gold" id="btn-add" type="button">
          <span class="btn-ico">＋</span><span class="btn-text">ADD</span>
        </button>
        <div class="menu-wrap">
          <button class="btn btn-cyan" id="btn-menu" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="btn-ico">☰</span><span class="btn-text">MENU</span>
          </button>
          <div class="menu hidden" id="menu" role="menu">
            <div class="menu-user" id="menu-user"></div>
            <a class="menu-item" href="dashboard.html" role="menuitem">▣ DASHBOARD</a>
            <a class="menu-item" href="scroll.html" role="menuitem">✦ THE SCROLL</a>
            <button class="menu-item" id="btn-export" type="button" role="menuitem">⇩ EXPORT JSON</button>
            <button class="menu-item" id="btn-import" type="button" role="menuitem">⇧ IMPORT JSON</button>
            <button class="menu-item" id="btn-clear-done" type="button" role="menuitem">✓ CLEAR COMPLETED</button>
            <button class="menu-item red" id="btn-signout" type="button" role="menuitem">⏻ SIGN OUT</button>
          </div>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <!-- SIGNED OUT / LOADING -->
    <main class="main gate" id="gate">
      <div class="gate-card">
        <div class="gate-title">ENTER THE TABLETS</div>
        <p class="gate-text" id="gate-text">SUMMONING…</p>
        <button class="btn btn-gold hidden" id="btn-signin" type="button">
          <span class="btn-ico">G</span><span>SIGN IN WITH GOOGLE</span>
        </button>
        <div class="hint" id="gate-hint"></div>
      </div>
    </main>

    <!-- SIGNED IN -->
    <main class="main signed-in-only hidden" id="main">
      <form class="quick" id="quick" autocomplete="off">
        <div class="quick-top">
          <input id="quick-title" class="input quick-input" placeholder="Add a task…" enterkeyhint="done" />
          <button class="btn btn-gold quick-add" type="submit">ADD</button>
        </div>
        <div class="quick-row">
          <div class="chips" role="radiogroup" aria-label="When">
            <button type="button" class="chip-btn" data-when="none" role="radio">GENERAL</button>
            <button type="button" class="chip-btn" data-when="today" role="radio">TODAY</button>
            <button type="button" class="chip-btn" data-when="tomorrow" role="radio">TMRW</button>
            <label class="chip-btn chip-date" data-when="pick" role="radio">
              <span id="quick-date-label">📅 DATE</span>
              <input type="date" id="quick-date" aria-label="Pick a due date" />
            </label>
          </div>
        </div>
      </form>

      <div class="toolbar">
        <div class="search-wrap">
          <span class="chip">SEARCH</span>
          <input id="search" class="input" placeholder="Search tasks..." autocomplete="off" />
        </div>
        <label class="check">
          <input id="toggle-completed" type="checkbox" />
          <span>SHOW COMPLETED</span>
        </label>
      </div>

      <nav class="tabs" role="tablist">
        <button class="tab" data-tab="due" role="tab" type="button">
          <span class="sigil sigil-gold" aria-hidden="true"></span>DUE <span class="count" id="tab-count-due">0</span>
        </button>
        <button class="tab" data-tab="general" role="tab" type="button">
          <span class="sigil sigil-cyan" aria-hidden="true"></span>GENERAL <span class="count" id="tab-count-general">0</span>
        </button>
      </nav>

      <section class="columns" id="columns">
        <div class="col" data-col="due">
          <div class="col-head">
            <div class="col-title">
              <span class="sigil sigil-gold" aria-hidden="true"></span>
              <span>DUE DATES</span>
              <span class="count" id="count-due">0</span>
            </div>
          </div>
          <div class="list" id="list-due"></div>
        </div>

        <div class="col" data-col="general">
          <div class="col-head">
            <div class="col-title">
              <span class="sigil sigil-cyan" aria-hidden="true"></span>
              <span>GENERAL</span>
              <span class="count" id="count-general">0</span>
            </div>
            <div class="col-controls">
              <select class="select" id="sort-general" title="Sort general tasks">
                <option value="old">OLDEST FIRST</option>
                <option value="new">NEWEST FIRST</option>
                <option value="az">A → Z</option>
                <option value="za">Z → A</option>
                <option value="timeLow">QUICKEST FIRST</option>
                <option value="timeHigh">LONGEST FIRST</option>
                <option value="random">RANDOM</option>
              </select>
              <button class="btn btn-void btn-sm" id="shuffle-general" type="button" title="Reshuffle">🎲</button>
            </div>
          </div>
          <div class="list" id="list-general"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal hidden" id="modal">
    <div class="modal-backdrop" id="modal-close"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <div class="modal-title" id="modal-title">INSCRIBE A TASK</div>
        <button class="btn btn-red btn-sm" id="modal-x" type="button" aria-label="Close">✕</button>
      </div>

      <form class="modal-body" id="modal-form" autocomplete="off">
        <label class="field">
          <span class="label">TASK NAME</span>
          <input class="input" id="task-title" maxlength="300" placeholder="e.g., Call supplier, Build landing page..." />
        </label>

        <div class="segmented" role="radiogroup" aria-label="Section">
          <button type="button" class="seg" data-section="due" role="radio">◆ HAS A DUE DATE</button>
          <button type="button" class="seg" data-section="general" role="radio">◇ GENERAL</button>
        </div>

        <div class="grid2" id="due-wrap">
          <label class="field">
            <span class="label">DUE DATE</span>
            <input class="input" type="date" id="task-due" />
          </label>
          <label class="field">
            <span class="label">TIME (OPTIONAL)</span>
            <input class="input" type="time" id="task-time" />
          </label>
        </div>

        <label class="check">
          <input id="has-est" type="checkbox" />
          <span>ESTIMATED TIME?</span>
        </label>
        <label class="field hidden" id="est-wrap">
          <span class="label">MINUTES</span>
          <input class="input" id="task-est" inputmode="numeric" placeholder="e.g., 25" />
        </label>

        <label class="field">
          <span class="label">NOTES (OPTIONAL)</span>
          <textarea class="input textarea" id="task-notes" maxlength="5000" placeholder="Quick notes..."></textarea>
        </label>

        <div class="modal-foot">
          <button class="btn btn-void" id="btn-cancel" type="button">CANCEL</button>
          <button class="btn btn-gold" id="btn-save" type="submit">SAVE</button>
        </div>
        <div class="hint" id="modal-hint"></div>
      </form>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

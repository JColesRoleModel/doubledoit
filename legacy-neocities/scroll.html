<!doctype html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />

<body>
  <div class="fx" aria-hidden="true">
    <div class="dither"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <div class="title-row">
            <h1 class="title">THE SCROLL</h1>

          <div class="subtitle">RULES // RITUAL // EXECUTION</div>

      </div>

    <main class="main">
      <div class="col" style="max-width:900px;margin:0 auto;">
        <div class="col-head">
          <div class="col-title">
            <span class="sigil sigil-gold" aria-hidden="true"></span>
            <span>HOW IT SAVES</span>
          </div>
        </div>

        <div class="list">
          <div class="card">
            <div class="card-top">
              <div style="flex:1">
                <div class="card-title">DEVICE-SAVED</div>
                <div class="card-meta">
                  <div class="tag gold">LOCALSTORAGE</div>
                  <div class="tag">OFFLINE CACHE</div>
                </div>
              </div>
            </div>
            <div class="card-notes">
Your tasks are stored on the device automatically.
If you add this to Home Screen, it runs like an app.
First visit requires internet; after that it runs offline.
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(()=>{});
    }
